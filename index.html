<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDS Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:15px; color:#111827; }
.header-box { background:#e5e7eb; padding:15px; border-radius:10px; text-align:center; margin-bottom:15px; }
.header-box h2 { margin:5px; }
.top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.toolbar-left, .toolbar-right { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.toolbar-left { gap:10px; }
.control-group { display:flex; align-items:center; gap:6px; padding:6px 9px; background:#fff; border:1px solid #d1d5db; border-radius:8px; }
.control-group label { font-size:13px; font-weight:700; white-space:nowrap; }
.control-group select, input { padding:7px 8px; border-radius:5px; border:1px solid #cbd5e1; background:#fff; font-size:13px; max-width:100%; }
.top-bar button { padding:8px 13px; border:none; border-radius:6px; margin:0; cursor:pointer; color:white; font-weight:700; }
.top-bar button:hover { filter:brightness(.94); }
.excel { background:#16a34a; }
.pdf { background:#dc2626; }
.print { background:#2563eb; }
.refresh { background:#f59e0b; }
table { width:100%; border-collapse:collapse; background:white; }
th { background:#1e3a8a; color:white; padding:8px; font-size:14px; }
td { padding:7px; border:1px solid #ddd; font-size:13px; }
tr:nth-child(even) { background:#f9fafb; }
.loading { text-align:center; padding:30px; font-size:18px; }
.error { color:#b91c1c; text-align:center; padding:20px; }
.table-scroll { width:100%; overflow-x:auto; }

@media (max-width:700px) {
  body { padding:8px; }
  .top-bar { align-items:stretch; }
  .toolbar-left, .toolbar-right { width:100%; }
  .control-group { flex:1 1 100%; justify-content:space-between; }
  .control-group select { flex:1; min-width:0; }
  .toolbar-right { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .toolbar-right button { width:100%; }
}

/* PDF और Print के लिए जरूरी सेटिंग्स */
@media print {
  body { padding:0; background:#fff; }
  .top-bar { display:none !important; }
  .header-box { background:#fff; border:1px solid #ddd; }
  .table-scroll { overflow:visible; }
  .data-table thead { display: table-header-group; } /* हर पेज पर हेडर दोहराएगा */
  .data-table tr { page-break-inside: avoid; } /* पंक्ति बीच से नहीं कटेगी */
}

/* PDF के लिए कस्टम क्लास */
.pdf-export-mode .top-bar { display: none !important; }
.pdf-export-mode .header-box { 
    display: block !important; 
    position: running(header); 
    margin-bottom: 20px; 
    text-align: center; 
    background: #fff; 
    border: 1px solid #ccc;
    padding: 10px;
}
</style>
</head>
<body>

<!-- MAIN WRAPPER (जिसे PDF में कैप्चर किया जाएगा) -->
<div id="reportWrapper">

    <!-- यह हेडर अब PDF में भी आएगा -->
    <div class="header-box" id="reportHeaderBox">
      <h2 id="shopName">दुकानदार का नाम: -- | दुकान संख्या: --</h2>
      <p id="nikayaJila"></p>
      <small>Report Generated: <span id="reportTime"></span></small>
    </div>

    <!-- कंट्रोल्स (ये PDF में नहीं आएंगे) -->
    <div class="top-bar">
      <div class="toolbar-left">
        <div class="control-group">
          <label for="monthPicker">महीना</label>
          <input type="month" id="monthPicker">
        </div>
        <div class="control-group">
          <label for="sortBy">Sort By</label>
          <select id="sortBy" aria-label="Sort By कार्ड का प्रकार">
            <option value="AAY" selected>AAY पहले</option>
            <option value="PHH">PHH पहले</option>
          </select>
        </div>
        <div class="control-group">
          <label for="viewBy">View</label>
          <select id="viewBy" aria-label="View के अनुसार क्रम">
            <option value="ration" selected>राशन कार्ड संख्या</option>
            <option value="name">धारक का नाम</option>
            <option value="units">कुल यूनिट</option>
          </select>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="excel" onclick="downloadExcel()">Excel</button>
        <button class="pdf" onclick="downloadPDF()">PDF</button>
        <button class="print" onclick="window.print()">Print</button>
        <button class="refresh" onclick="fetchData()">Refresh</button>
      </div>
    </div>

    <!-- टेबल कंटेनर -->
    <div id="table-container">
      <div class="loading">डेटा लोड हो रहा है...</div>
    </div>

</div>

<script>
document.getElementById("reportTime").innerText = new Date().toLocaleString();

const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shop');
const shopName = urlParams.get('shopName') || '--';
const shopNumber = urlParams.get('shopNumber') || '--';
const nikaya = urlParams.get('nikaya') || '--';
const jila = urlParams.get('jila') || '--';

let originalSheetData = [];

document.getElementById('shopName').textContent = `दुकानदार का नाम: ${shopName} | दुकान संख्या: ${shopNumber}`;
document.getElementById('nikayaJila').textContent = `जिला : ${jila} ब्लॉक : ${nikaya}`;

if (!shopId) {
  document.getElementById("table-container").innerHTML = '<div class="error">Shop ID missing. Use ?shop=YOUR_SHEET_ID</div>';
} else {
  fetchData();
}

document.getElementById('sortBy').addEventListener('change', renderSortedTable);
document.getElementById('viewBy').addEventListener('change', renderSortedTable);

async function fetchData() {
  const container = document.getElementById("table-container");
  container.innerHTML = '<div class="loading">लोड हो रहा है...</div>';

  try {
    const res = await fetch(`/.netlify/functions/getShopData?shop=${encodeURIComponent(shopId)}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();

    if (data.status === 'success') {
      originalSheetData = Array.isArray(data.data) ? data.data : [];
      renderSortedTable();
    } else {
      originalSheetData = [];
      container.innerHTML = `<div class="error">${escapeHtml(data.message || 'Unknown error')}</div>`;
    }
  } catch (err) {
    container.innerHTML = `<div class="error">Network error: ${escapeHtml(err.message)}</div>`;
  }
}

function normalizeHeader(value) {
  return String(value == null ? '' : value).replace(/[\s\u200B-\u200D\uFEFF]+/g, '').trim().toLowerCase();
}

function findColumn(headers, candidates) {
  const normalized = headers.map(normalizeHeader);
  for (const candidate of candidates) {
    const index = normalized.indexOf(normalizeHeader(candidate));
    if (index !== -1) return index;
  }
  return -1;
}

function compareHindiText(a, b) {
  return String(a == null ? '' : a).trim().localeCompare(String(b == null ? '' : b).trim(), 'hi', {
    numeric: true,
    sensitivity: 'base'
  });
}

function compareCardNumbers(a, b) {
  const left = String(a == null ? '' : a).trim();
  const right = String(b == null ? '' : b).trim();
  return left.localeCompare(right, 'en', { numeric: true, sensitivity: 'base' });
}

function numericValue(value) {
  const cleaned = String(value == null ? '' : value).replace(/,/g, '').trim();
  const match = cleaned.match(/-?\d+(?:\.\d+)?/);
  return match ? Number(match[0]) : 0;
}

function renderSortedTable() {
  const container = document.getElementById('table-container');
  if (!originalSheetData.length || originalSheetData.length < 2) {
    container.innerHTML = '<div class="error">No data found</div>';
    return;
  }

  const headers = originalSheetData[0].map(value => String(value == null ? '' : value).trim());
  const rows = originalSheetData.slice(1).filter(row => Array.isArray(row));

  const cardTypeIndex = findColumn(headers, ['कार्ड का प्रकार', 'राशन कार्ड का प्रकार', 'Card Type', 'Scheme']);
  const rationIndex = findColumn(headers, ['राशन कार्ड संख्या', 'राशन कार्ड सं.', 'राशन कार्ड नंबर', 'Ration Card Number', 'RC Number', 'RC No']);
  const nameIndex = findColumn(headers, ['धारक का नाम', 'राशन कार्ड धारक का नाम', 'Card Holder Name', 'Name']);
  const unitsIndex = findColumn(headers, ['कुल यूनिट', 'कुल इकाई', 'Total Units', 'Units']);

  const sortPreference = document.getElementById('sortBy').value || 'AAY';
  const viewPreference = document.getElementById('viewBy').value || 'ration';

  const decoratedRows = rows.map((row, index) => ({ row, originalIndex: index }));
  decoratedRows.sort((a, b) => {
    if (cardTypeIndex !== -1) {
      const typeA = String(a.row[cardTypeIndex] == null ? '' : a.row[cardTypeIndex]).trim().toUpperCase();
      const typeB = String(b.row[cardTypeIndex] == null ? '' : b.row[cardTypeIndex]).trim().toUpperCase();
      const priorityA = typeA === sortPreference ? 0 : 1;
      const priorityB = typeB === sortPreference ? 0 : 1;
      if (priorityA !== priorityB) return priorityA - priorityB;
    }

    let comparison = 0;
    if (viewPreference === 'ration' && rationIndex !== -1) {
      comparison = compareCardNumbers(a.row[rationIndex], b.row[rationIndex]);
    } else if (viewPreference === 'name' && nameIndex !== -1) {
      comparison = compareHindiText(a.row[nameIndex], b.row[nameIndex]);
    } else if (viewPreference === 'units' && unitsIndex !== -1) {
      comparison = numericValue(a.row[unitsIndex]) - numericValue(b.row[unitsIndex]);
    }
    return comparison || a.originalIndex - b.originalIndex;
  });

  // यहाँ table में class="data-table" जोड़ा गया है ताकि CSS पेज ब्रेक कंट्रोल कर सके
  let html = '<div class="table-scroll"><table id="reportTable" class="data-table"><thead><tr><th>क्रम</th>';
  headers.forEach(header => { html += `<th>${escapeHtml(header)}</th>`; });
  html += '</tr></thead><tbody>';

  decoratedRows.forEach((item, index) => {
    html += `<tr><td>${index + 1}</td>`;
    headers.forEach((_, colIndex) => {
      html += `<td>${escapeHtml(item.row[colIndex] == null ? '' : item.row[colIndex])}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    if (m === "'") return '&#39;';
    return m;
  });
}

async function downloadPDF() {
    const element = document.getElementById("reportWrapper");
    if (!element) { alert('पहले डेटा लोड होने दें।'); return; }

    // PDF बनाते समय टूलबार को छिपाने के लिए क्लास जोड़ें
    document.body.classList.add('pdf-export-mode');

    try {
        // PDF सेटिंग्स
        const opt = {
            margin:       [0.3, 0.3, 0.3, 0.3], // मार्जिन (ऊपर, दाएं, नीचे, बाएं)
            filename:     `report_${shopNumber}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['css', 'legacy'], avoid: ['tr', '.header-box'] } // पंक्ति और हेडर बीच से न कटें
        };

        await html2pdf().set(opt).from(element).save();
    } catch (err) {
        console.error(err);
        alert('PDF बनाने में समस्या आई।');
    } finally {
        // काम खत्म होने पर क्लास हटा दें ताकि वेबसाइट सामान्य दिखे
        document.body.classList.remove('pdf-export-mode');
    }
}

function downloadExcel() {
  const table = document.getElementById("reportTable");
  if (!table) { alert('पहले डेटा लोड होने दें।'); return; }
  const html = '<html><head><meta charset="UTF-8"></head><body>' + table.outerHTML + '</body></html>';
  const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `report_${shopNumber}.xls`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
